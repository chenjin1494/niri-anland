name: Anland legacy v5 Arch Linux ARM64 build

on:
  push:
    branches: [master, main]
    paths:
      - '.github/workflows/anland-arch-arm64.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - 'src/**'
      - 'niri-config/**'
      - 'niri-ipc/**'
      - 'resources/**'
      - 'docs/anland/**'
      - 'packaging/**'
    tags:
      - 'anland-v*'
  pull_request:
    paths:
      - '.github/workflows/anland-arch-arm64.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - 'src/**'
      - 'niri-config/**'
      - 'niri-ipc/**'
      - 'resources/**'
      - 'docs/anland/**'
      - 'packaging/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Bootstrap Arch Linux ARM64 and build
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl ca-certificates

          ROOTFS="$RUNNER_TEMP/archlinuxarm"
          ROOTFS_ARCHIVE="$RUNNER_TEMP/ArchLinuxARM-aarch64-latest.tar.gz"
          sudo mkdir -p "$ROOTFS"

          curl -fL --retry 3 \
            https://ca.us.mirror.archlinuxarm.org/os/ArchLinuxARM-aarch64-latest.tar.gz \
            -o "$ROOTFS_ARCHIVE"
          sudo tar -xpf "$ROOTFS_ARCHIVE" -C "$ROOTFS"

          cleanup() {
            sudo umount "$ROOTFS/workspace" 2>/dev/null || true
            sudo umount "$ROOTFS/sys" 2>/dev/null || true
            sudo umount "$ROOTFS/proc" 2>/dev/null || true
            sudo umount -R "$ROOTFS/dev" 2>/dev/null || true
          }
          trap cleanup EXIT

          sudo rm -f "$ROOTFS/etc/resolv.conf"
          sudo cp /etc/resolv.conf "$ROOTFS/etc/resolv.conf"
          sudo mkdir -p "$ROOTFS/workspace"
          sudo mount --rbind /dev "$ROOTFS/dev"
          sudo mount --make-rslave "$ROOTFS/dev"
          sudo mount -t proc proc "$ROOTFS/proc"
          sudo mount -t sysfs sysfs "$ROOTFS/sys"
          sudo mount --bind "$GITHUB_WORKSPACE" "$ROOTFS/workspace"

          sudo chroot "$ROOTFS" /usr/bin/bash --noprofile --norc -euo pipefail -c '
            pacman-key --init
            pacman-key --populate archlinuxarm
            pacman -Syu --noconfirm --needed \
              base-devel rust pkgconf clang cmake git binutils curl ca-certificates \
              systemd-libs mesa libglvnd libxkbcommon wayland libinput dbus \
              seatd pipewire pango libdisplay-info libadwaita
            cd /workspace
            bash packaging/build-arch-aarch64.sh
          '
      - uses: actions/upload-artifact@v4
        with:
          name: niri-anland-archlinux-aarch64
          path: |
            dist/*.tar.xz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30
